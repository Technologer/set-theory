<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set Theory</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-locked">

<!-- ===== Intro ===== -->
<div class="intro" id="intro">
  <div class="intro__glow" aria-hidden="true"></div>
  <div class="intro__inner">
    <p class="intro__kicker" data-i18n="introKicker"></p>
    <h1 class="intro__title">Set<span>Theory</span></h1>
    <p class="intro__pitch" data-i18n="introPitch"></p>
    <button class="btn-begin" id="begin" type="button" data-i18n="begin"></button>
    <p class="intro__hint" data-i18n-html="introHint"></p>
  </div>
</div>

<!-- ===== Top chrome ===== -->
<header class="topbar" id="topbar">
  <div class="topbar__row">
    <span class="topbar__brand">Set&nbsp;Theory</span>
    <span class="topbar__now" id="now-playing">
      <span class="topbar__act" id="now-act"></span>
      <span class="topbar__sep">·</span>
      <span class="topbar__genre" id="now-genre"></span>
    </span>
    <span class="topbar__tools">
      <span class="topbar__count" id="now-count">01 / 24</span>
      <div class="search" id="search">
        <button class="iconbtn" id="search-toggle" type="button"
                data-i18n-aria-label="searchToggle" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <input class="search__input" id="search-input" type="text" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchPlaceholder"
               autocomplete="off" spellcheck="false" aria-label="Jump to a genre or artist">
        <ul class="search__results" id="search-results"></ul>
      </div>
      <button class="iconbtn iconbtn--sound" id="sound-toggle" type="button"
              aria-label="Turn sound on" aria-pressed="false">
        <svg class="ic-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
        <svg class="ic-loud" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
      </button>
      <button class="iconbtn iconbtn--lang" id="lang-toggle" type="button" aria-label="Prepnúť na slovenčinu">SK</button>
    </span>
  </div>
  <div class="topbar__progress"><span id="progress-fill"></span></div>
</header>

<!-- ===== Side rail ===== -->
<nav class="rail" id="rail" aria-label="Genre navigation"></nav>

<!-- ===== Sections (rendered from data.js) ===== -->
<main id="journey"></main>

<!-- ===== Outro ===== -->
<section class="outro" id="outro">
  <div class="outro__inner">
    <p class="outro__kicker" data-i18n="outroKicker"></p>
    <h2 class="outro__title" data-i18n="outroTitle"></h2>
    <p class="outro__text" data-i18n="outroText"></p>
    <p class="outro__note" data-i18n-html="outroNote"></p>

    <section class="craft" aria-labelledby="craft-title">
      <h3 class="craft__title" id="craft-title" data-i18n="craftTitle"></h3>
      <p class="craft__sub" data-i18n="craftSub"></p>

      <ul class="craft__list">
        <li class="craft__item" style="--accent:#3dffc9">
          <h4 data-i18n="craft.0.h"></h4>
          <p data-i18n="craft.0.p"></p>
        </li>

        <li class="craft__item" style="--accent:#ff3d81">
          <h4 data-i18n="craft.1.h"></h4>
          <p data-i18n="craft.1.p"></p>
        </li>

        <li class="craft__item" style="--accent:#3dc9ff">
          <h4 data-i18n="craft.2.h"></h4>
          <p data-i18n="craft.2.p"></p>
        </li>

        <li class="craft__item" style="--accent:#7cff3d">
          <h4 data-i18n="craft.3.h"></h4>
          <p data-i18n="craft.3.p"></p>
        </li>

        <li class="craft__item" style="--accent:#7c4dff">
          <h4 data-i18n="craft.4.h"></h4>
          <p data-i18n="craft.4.p"></p>
        </li>

        <li class="craft__item" style="--accent:#ffd23d">
          <h4 data-i18n="craft.5.h"></h4>
          <p data-i18n="craft.5.p"></p>
        </li>
      </ul>
    </section>

    <section class="recap-block" aria-labelledby="recap-title">
      <h3 class="craft__title" id="recap-title" data-i18n="recapTitle"></h3>
      <p class="craft__sub" data-i18n="recapSub"></p>
      <div class="outro__grid" id="outro-grid"></div>
    </section>
    <button class="btn-begin btn-begin--ghost" id="restart" type="button" data-i18n="restart"></button>
  </div>
</section>

<!-- ===== Toast ===== -->
<div class="toast" id="toast" role="status" aria-live="polite" data-i18n="toast"></div>

<script src="js/i18n/en.js"></script>
<script src="js/i18n/sk.js"></script>
<script src="js/data.js"></script>
<script src="js/audio-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
